services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: ecommerce-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-ecommerce}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-ecommerce}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  eureka:
    build: ./eureka-server
    container_name: ecommerce-eureka
    ports:
      - "8761:8761"
    environment:
      SERVER_PORT: 8761

  gateway:
    build: ./gateway
    container_name: ecommerce-gateway
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SERVER_PORT: 8080
      EUREKA_ENABLED: "true"
      EUREKA_URI: http://eureka:8761/eureka
      AUTH_SERVICE_URI: http://auth:8081
      PRODUCT_SERVICE_URI: http://product:8082
      CART_SERVICE_URI: http://cart:8083
      INVENTORY_SERVICE_URI: http://inventory:8084
      ORDER_SERVICE_URI: http://order:8085
      PAYMENT_SERVICE_URI: http://payment:8086
      NOTIFICATION_SERVICE_URI: http://notification:8087
    depends_on:
      - eureka
      - auth
      - product
      - cart
      - inventory
      - order
      - payment
      - notification

  auth:
    build: ./auth-service
    container_name: ecommerce-auth
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment: &db
      SERVER_PORT: 8081
      DB_HOST: host.docker.internal
      DB_PORT: ${DB_PORT:-5432}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret-at-least-256-bits}
      EUREKA_ENABLED: "true"
      EUREKA_URI: http://eureka:8761/eureka
    ports:
      - "8081:8081"
    depends_on:
      - eureka

  product:
    build: ./product-service
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      <<: *db
      SERVER_PORT: 8082
    ports: ["8082:8082"]
    depends_on:
      - eureka

  cart:
    build: ./cart-service
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      <<: *db
      SERVER_PORT: 8083
      PRODUCT_SERVICE_URI: http://product:8082
    ports: ["8083:8083"]
    depends_on:
      - eureka

  inventory:
    build: ./inventory-service
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      <<: *db
      SERVER_PORT: 8084
    ports: ["8084:8084"]
    depends_on:
      - eureka

  order:
    build: ./order-service
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      <<: *db
      SERVER_PORT: 8085
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-ecommerce}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-ecommerce}
      PRODUCT_SERVICE_URI: http://product:8082
      CART_SERVICE_URI: http://cart:8083
      INVENTORY_SERVICE_URI: http://inventory:8084
      PAYMENT_SERVICE_URI: http://payment:8086
    ports: ["8085:8085"]
    depends_on:
      eureka:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  payment:
    build: ./payment-service
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      <<: *db
      SERVER_PORT: 8086
    ports: ["8086:8086"]
    depends_on:
      - eureka

  notification:
    build: ./notification-service
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      <<: *db
      SERVER_PORT: 8087
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-ecommerce}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-ecommerce}
    ports: ["8087:8087"]
    depends_on:
      eureka:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - gateway
