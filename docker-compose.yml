name: gtvt_ecommerce

x-jvm-build: &jvm-build
  context: .
  dockerfile: docker/jvm.Dockerfile

x-db-env: &db-env
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USERNAME: ${DB_USERNAME:-postgres}
  DB_PASSWORD: ${DB_PASSWORD:-123456}
  JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret-at-least-256-bits}
  EUREKA_ENABLED: "true"
  EUREKA_URI: http://eureka:8761/eureka
  ADMIN_SERVER_URI: http://admin:8088

x-mail-env: &mail-env
  MAIL_ENABLED: ${MAIL_ENABLED:-true}
  BREVO_API_KEY: ${BREVO_API_KEY:-}
  MAIL_FROM: ${MAIL_FROM:-reply@debase.vn}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Nava}
  STORE_PUBLIC_URL: ${STORE_PUBLIC_URL:-http://localhost:5173}
  BREVO_API_BASE_URL: ${BREVO_API_BASE_URL:-https://api.brevo.com}

services:
  postgres:
    image: postgres:17
    container_name: ecommerce-postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123456}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-postgres.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: ecommerce-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-ecommerce}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-ecommerce}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  eureka:
    build:
      <<: *jvm-build
      args:
        MODULE: eureka-server
    image: gtvt-ecommerce-eureka
    container_name: ecommerce-eureka
    ports:
      - "8761:8761"
    environment:
      SERVER_PORT: 8761
    restart: unless-stopped

  admin:
    build:
      <<: *jvm-build
      args:
        MODULE: admin-server
    image: gtvt-ecommerce-admin
    container_name: ecommerce-admin
    ports:
      - "8088:8088"
    environment:
      SERVER_PORT: 8088
      FLOW_GATEWAY_URI: http://gateway:8080
      FLOW_AUTH_URI: http://auth:8081
      FLOW_PRODUCT_URI: http://product:8082
      FLOW_CART_URI: http://cart:8083
      FLOW_INVENTORY_URI: http://inventory:8084
      FLOW_ORDER_URI: http://order:8085
      FLOW_PAYMENT_URI: http://payment:8086
      FLOW_NOTIFICATION_URI: http://notification:8087
    depends_on:
      - eureka
    restart: unless-stopped

  gateway:
    build:
      <<: *jvm-build
      args:
        MODULE: gateway
    image: gtvt-ecommerce-gateway
    container_name: ecommerce-gateway
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      EUREKA_ENABLED: "true"
      EUREKA_URI: http://eureka:8761/eureka
      ADMIN_SERVER_URI: http://admin:8088
      ADMIN_INSTANCE_BASE_URL: http://gateway:8080
      AUTH_SERVICE_URI: http://auth:8081
      PRODUCT_SERVICE_URI: http://product:8082
      CART_SERVICE_URI: http://cart:8083
      INVENTORY_SERVICE_URI: http://inventory:8084
      ORDER_SERVICE_URI: http://order:8085
      PAYMENT_SERVICE_URI: http://payment:8086
      NOTIFICATION_SERVICE_URI: http://notification:8087
    depends_on:
      - eureka
      - auth
      - product
      - cart
      - inventory
      - order
      - payment
      - notification
    restart: unless-stopped

  auth:
    build:
      <<: *jvm-build
      args:
        MODULE: auth-service
    image: gtvt-ecommerce-auth
    container_name: ecommerce-auth
    environment:
      <<: [*db-env, *mail-env]
      SERVER_PORT: 8081
      ADMIN_INSTANCE_BASE_URL: http://auth:8081
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_started
    restart: unless-stopped

  product:
    build:
      <<: *jvm-build
      args:
        MODULE: product-service
    image: gtvt-ecommerce-product
    container_name: ecommerce-product
    environment:
      <<: *db-env
      SERVER_PORT: 8082
      ADMIN_INSTANCE_BASE_URL: http://product:8082
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_started
    restart: unless-stopped

  cart:
    build:
      <<: *jvm-build
      args:
        MODULE: cart-service
    image: gtvt-ecommerce-cart
    container_name: ecommerce-cart
    environment:
      <<: *db-env
      SERVER_PORT: 8083
      ADMIN_INSTANCE_BASE_URL: http://cart:8083
      PRODUCT_SERVICE_URI: http://product:8082
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_started
    restart: unless-stopped

  inventory:
    build:
      <<: *jvm-build
      args:
        MODULE: inventory-service
    image: gtvt-ecommerce-inventory
    container_name: ecommerce-inventory
    environment:
      <<: *db-env
      SERVER_PORT: 8084
      ADMIN_INSTANCE_BASE_URL: http://inventory:8084
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_started
    restart: unless-stopped

  order:
    build:
      <<: *jvm-build
      args:
        MODULE: order-service
    image: gtvt-ecommerce-order
    container_name: ecommerce-order
    environment:
      <<: *db-env
      SERVER_PORT: 8085
      ADMIN_INSTANCE_BASE_URL: http://order:8085
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-ecommerce}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-ecommerce}
      PRODUCT_SERVICE_URI: http://product:8082
      CART_SERVICE_URI: http://cart:8083
      INVENTORY_SERVICE_URI: http://inventory:8084
      PAYMENT_SERVICE_URI: http://payment:8086
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  payment:
    build:
      <<: *jvm-build
      args:
        MODULE: payment-service
    image: gtvt-ecommerce-payment
    container_name: ecommerce-payment
    environment:
      <<: *db-env
      SERVER_PORT: 8086
      ADMIN_INSTANCE_BASE_URL: http://payment:8086
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_started
    restart: unless-stopped

  notification:
    build:
      <<: *jvm-build
      args:
        MODULE: notification-service
    image: gtvt-ecommerce-notification
    container_name: ecommerce-notification
    environment:
      <<: [*db-env, *mail-env]
      SERVER_PORT: 8087
      ADMIN_INSTANCE_BASE_URL: http://notification:8087
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-ecommerce}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-ecommerce}
    ports:
      - "8087:8087"
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: gtvt-ecommerce-frontend
    container_name: ecommerce-frontend
    ports:
      - "5173:80"
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  postgres-data:
  rabbitmq-data:
