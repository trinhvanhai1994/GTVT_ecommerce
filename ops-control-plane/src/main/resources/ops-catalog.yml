services:
  - id: postgres
    displayName: PostgreSQL
    group: infra
    composeService: postgres
    containerName: ecommerce-postgres
    port: 5432
    health: docker
    logs: docker
  - id: rabbitmq
    displayName: RabbitMQ
    group: infra
    composeService: rabbitmq
    containerName: ecommerce-rabbitmq
    port: 15672
    health: docker
    logs: docker
  - id: eureka
    displayName: Eureka
    group: infra
    composeService: eureka
    containerName: ecommerce-eureka
    mavenModule: eureka-server
    port: 8761
    healthUrl: http://eureka:8761/actuator/health
    healthUrlHost: http://localhost:8761/actuator/health
    logs: actuator
    logfileUrl: http://eureka:8761/actuator/logfile
    logfileUrlHost: http://localhost:8761/actuator/logfile
  - id: admin
    displayName: Spring Boot Admin
    group: infra
    composeService: admin
    containerName: ecommerce-admin
    mavenModule: admin-server
    port: 8088
    healthUrl: http://admin:8088/actuator/health
    healthUrlHost: http://localhost:8088/actuator/health
    logs: docker
  - id: gateway
    displayName: API Gateway
    group: app
    composeService: gateway
    containerName: ecommerce-gateway
    mavenModule: gateway
    port: 8080
    healthUrl: http://gateway:8080/actuator/health
    healthUrlHost: http://localhost:8080/actuator/health
    logs: actuator
    logfileUrl: http://gateway:8080/actuator/logfile
    logfileUrlHost: http://localhost:8080/actuator/logfile
  - id: auth
    displayName: Auth Service
    group: app
