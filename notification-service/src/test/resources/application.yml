spring:
  datasource:
    url: jdbc:h2:mem:notificationdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  rabbitmq:
    listener:
      simple:
        auto-startup: false
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
jwt:
  secret: test-secret-key-which-is-at-least-thirty-two-chars
  expiration-ms: 3600000
mail:
  enabled: false
  from: test@example.com
  from-name: Nava Test
  store-url: http://localhost:5173
  brevo-api-key: ""
  brevo-api-base-url: https://api.brevo.com
