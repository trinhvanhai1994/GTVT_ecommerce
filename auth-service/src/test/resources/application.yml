spring:
  profiles:
    active: test
  datasource:
    url: jdbc:h2:mem:authdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
jwt:
  secret: test-secret-key-which-is-at-least-thirty-two-chars
  expiration-ms: 3600000
